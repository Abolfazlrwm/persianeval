name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + mypy + pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy --strict src tests scripts

      - name: Test (pytest, coverage >= 80%)
        run: pytest --cov=persianeval --cov-report=term-missing --cov-fail-under=80

      - name: Verify frozen datasets match checksums
        run: |
          cd src/persianeval/data/v1
          sha256sum -c SHA256SUMS
