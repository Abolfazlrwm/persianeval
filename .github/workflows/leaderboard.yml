name: Leaderboard

# Weekly evaluation of open-source models through local Ollama runners,
# publishing the static leaderboard to GitHub Pages.
# See ADR 0003 (docs/adr/0003-leaderboard-freshness.md) for the sampling policy.

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      site_only:
        description: "Skip model evaluation; publish the site from committed results"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

env:
  # Models evaluated each week (kept small enough for GitHub-hosted runners).
  MODELS: >-
    [
      {"name": "qwen2.5:7b-instruct", "org": "Qwen", "license": "Apache-2.0"},
      {"name": "llama3.1:8b", "org": "Meta", "license": "Llama 3.1 Community"},
      {"name": "gemma2:9b", "org": "Google", "license": "Gemma Terms"},
      {"name": "aya-expanse:8b", "org": "Cohere For AI", "license": "CC-BY-NC"}
    ]
  # Seeded subsample per task: cheap weekly freshness (ADR 0003).
  # Amended 2026-11-17: 50 -> 20 items. The 2026-11-16/17 postmortem showed
  # 7-9B CPU inference at ~45 s/item cannot finish 8 tasks x 50 items inside
  # the 350-minute job budget (gemma2:9b and aya-expanse:8b were killed
  # mid-run); 20 items keeps the full weekly matrix inside the window.
  WEEKLY_LIMIT: "20"
  RPM: "60"

jobs:
  evaluate:
    name: Evaluate ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ github.event_name == 'schedule' || !inputs.site_only }}
    strategy:
      fail-fast: false
      matrix:
        model: [qwen2.5:7b-instruct, llama3.1:8b, gemma2:9b, aya-expanse:8b]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PersianEval
        run: python -m pip install -e .

      - name: Install and start Ollama
        run: |
          # The systemd service started by the install script is flaky on
          # hosted runners (gemma2:9b job on 2026-11-16 never saw port
          # 11434 come up). Stop systemd, run `ollama serve` directly and
          # retry the whole sequence up to three times.
          for ATTEMPT in 1 2 3; do
            echo "ollama install attempt $ATTEMPT"
            curl -fsSL https://ollama.com/install.sh | sh
            sudo systemctl stop ollama 2>/dev/null || true
            sudo systemctl disable ollama 2>/dev/null || true
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:11434/api/tags; then
                echo "ollama is ready (attempt $ATTEMPT, poll $i)"
                exit 0
              fi
              sleep 2
            done
            echo "attempt $ATTEMPT: ollama did not become ready within 60s"
          done
          echo "ollama failed to start after 3 attempts" >&2
          tail -50 /tmp/ollama.log 2>/dev/null || true
          exit 1

      - name: Pull model
        run: |
          # 2026-11-17 postmortem: three fast pull failures in 66 s (llama3.1:8b
          # job) — a hard registry hiccup defeats a fixed 30 s retry window.
          # Five attempts with growing backoff cover multi-minute outages.
          for ATTEMPT in 1 2 3 4 5; do
            if ollama pull "${{ matrix.model }}"; then
              echo "model pulled (attempt $ATTEMPT)"
              exit 0
            fi
            case "$ATTEMPT" in
              1) SLEEP=30 ;;
              2) SLEEP=60 ;;
              3) SLEEP=90 ;;
              4) SLEEP=120 ;;
            esac
            echo "pull attempt $ATTEMPT failed - retrying in ${SLEEP}s"
            sleep "$SLEEP"
          done
          echo "ollama pull failed after 5 attempts" >&2
          exit 1

      - name: Resolve metadata for the model
        id: meta
        run: |
          ORG=$(echo "$MODELS" | jq -r --arg m "${{ matrix.model }}" '.[] | select(.name == $m) | .org')
          LIC=$(echo "$MODELS" | jq -r --arg m "${{ matrix.model }}" '.[] | select(.name == $m) | .license')
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "license=$LIC" >> "$GITHUB_OUTPUT"

      - name: Run all 8 tasks (seeded weekly subsample)
        run: |
          SEED="$(date -u +%G%V)"   # deterministic per ISO week (ADR 0003)
          for TASK in reasoning reading_comprehension spelling cultural_knowledge \
                      translation_fa_en rag_faithfulness bias_detection code_with_persian_comments; do
            # 2026-11-16 postmortem: the Ollama server died mid-run under the
            # memory pressure of concurrent CPU inference (all four matrix
            # jobs failed with ProviderError after 6 attempts). Mitigation:
            # serial in-flight requests, a tighter completion budget, and a
            # liveness check with auto-restart before each task.
            if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "ollama is not responding - restarting"
              sudo systemctl restart ollama || true
              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:11434/api/tags; then
                  echo "ollama is back (attempt $i)"
                  break
                fi
                sleep 2
              done
              ollama pull "${{ matrix.model }}"  # no-op if cached; reloads weights
            fi
            # The ollama process can still die mid-task (qwen2.5 7B died
            # ~10 minutes into serial inference on 2026-11-16). Retry each
            # task up to three times; restarting ollama resets whatever
            # memory state accumulated, and a task rerun is deterministic
            # (fixed seed) so a partial attempt is simply overwritten.
            # 2026-11-17 postmortem: when all three attempts failed, the loop
            # fell through and the step still exited 0 (the last `ollama pull`
            # set the exit code), so broken runs looked green. Track success
            # explicitly and fail the step honestly.
            TASK_OK=0
            for ATTEMPT in 1 2 3; do
              if persianeval run \
                  --task "$TASK" \
                  --provider ollama \
                  --model "${{ matrix.model }}" \
                  --org "${{ steps.meta.outputs.org }}" \
                  --license "${{ steps.meta.outputs.license }}" \
                  --limit "$WEEKLY_LIMIT" \
                  --seed "$SEED" \
                  --max-requests-per-minute "$RPM" \
                  --concurrency 1 \
                  --max-tokens 512 \
                  --request-timeout 600 \
                  --out results; then
                echo "task $TASK done (attempt $ATTEMPT)"
                TASK_OK=1
                break
              fi
              echo "task $TASK attempt $ATTEMPT failed - restarting ollama"
              sudo systemctl restart ollama 2>/dev/null || true
              pkill -f 'ollama serve' 2>/dev/null || true
              sleep 5
              nohup ollama serve >> /tmp/ollama.log 2>&1 &
              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:11434/api/tags; then
                  echo "ollama is back (poll $i)"
                  break
                fi
                sleep 2
              done
              ollama pull "${{ matrix.model }}"  # no-op if cached
            done
            if [ "$TASK_OK" -ne 1 ]; then
              echo "task $TASK failed after 3 attempts" >&2
              exit 1
            fi
          done

      - name: Dump crash evidence on failure
        if: failure()
        run: |
          echo "=== ollama log tail ==="
          tail -80 /tmp/ollama.log 2>/dev/null || echo "(no ollama log)"
          echo "=== oom / kill evidence (dmesg) ==="
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || true) | grep -iE "oom|kill|ollama" | tail -30 || echo "(no dmesg access)"
          echo "=== memory snapshot ==="
          free -h || true
          echo "=== results written so far ==="
          ls -la results/ 2>/dev/null || true
      - name: Compute artifact-safe slug
        id: slug
        run: echo "slug=$(echo "${{ matrix.model }}" | tr ':' '-')" >> "$GITHUB_OUTPUT"

      # 2026-11-17 postmortem: artifact names inherit the matrix model string,
      # and upload-artifact rejects `:` (results-qwen2.5:7b-instruct) — every
      # finished run failed at upload. Sanitize the name via the slug above.
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ steps.slug.outputs.slug }}
          path: results/*.json
          if-no-files-found: error

  publish:
    name: Build and deploy leaderboard
    needs: evaluate
    # 2026-11-17: publish whatever the matrix produced instead of skipping on
    # any single-model failure — a partially fresh leaderboard beats a stale one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PersianEval
        run: python -m pip install -e .

      - name: Download all result artifacts
        if: ${{ github.event_name == 'schedule' || !inputs.site_only }}
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: results
        continue-on-error: true  # fall back to committed results when none exist

      - name: Generate leaderboard site
        run: |
          mkdir -p results
          persianeval leaderboard --results-dir results --out site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
