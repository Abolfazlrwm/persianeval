name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    # Enabled once the repository variable ENABLE_PYPI_PUBLISH is "true".
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/persianeval/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # One-time setup on PyPI is still required: register this repository
        # + workflow file + environment `pypi` as a "trusted publisher" under
        # https://pypi.org/manage/account/publishing/. Until that is done the
        # OIDC exchange fails, so the step is marked continue-on-error to keep
        # the release pipeline green; it publishes automatically afterwards.
        continue-on-error: true

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release with attached distributions
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
